name: paquet

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  paquet:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Vérifier les scripts
        run: make verifier

      - name: Construire le paquet
        run: make paquet

      # Même base que Linux Mint 22 (Ubuntu 24.04). Sans les recommandations :
      # sur Ubuntu, firefox-locale-oc tirerait le snap de Firefox.
      - name: Installer le paquet dans Ubuntu 24.04
        run: |
          docker run --rm -v "$PWD/construction:/deb:ro" ubuntu:24.04 bash -euxc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q
            # Réglage GCompris pour un élève PrimTux (dossier personnel et modèle)
            for d in /home/jerry /etc/skel-jerry; do
              mkdir -p $d/.config/gcompris
              printf "[%%General]\nlocale=system\n" > $d/.config/gcompris/gcompris-qt.conf
            done
            mkdir -p /usr/lib/firefox/defaults/pref
            # Fichiers de PrimTux habillés par Occitux : menu des élèves, écran de connexion, fond
            mkdir -p /usr/share/primtuxmenu/templates /usr/share/primtuxmenu/SQL /var/lib/primtuxmenu /usr/share/web-greeter/themes/neon /usr/share/backgrounds/xfce /etc/linuxmint
            printf "<h1>Quel personnage&nbsp;?</h1><title>Primtux Menu</title>\n" > /usr/share/primtuxmenu/templates/index.html
            printf "INSERT INTO levels VALUES (1, %s);\n" "\"Mathématiques\"" > /usr/share/primtuxmenu/SQL/INSERT_levels.sql
            printf "placeholder:\"Mot de passe\"\n" > /usr/share/web-greeter/themes/neon/bundle.js
            printf "RELEASE=9\nDESCRIPTION=\"PrimTux 9\"\nGRUB_TITLE=PrimTux9\n" > /etc/linuxmint/info
            apt-get install -y -q --no-install-recommends sqlite3
            sqlite3 /var/lib/primtuxmenu/primtuxmenu.db "CREATE TABLE levels (id INTEGER, session TEXT, name_level_one TEXT, name_level_two TEXT); INSERT INTO levels VALUES (1, \"jerry\", \"Mathématiques\", NULL);"
            # Élagage des traductions de PrimTux (localepurge) : seul le français passe
            mkdir -p /etc/dpkg/dpkg.cfg.d
            printf "path-exclude=/usr/share/locale/*\npath-include=/usr/share/locale/fr/*\n" > /etc/dpkg/dpkg.cfg.d/50localepurge
            apt-get install -y -q --no-install-recommends /deb/occitux_*_all.deb
            test -L /usr/share/locale/oc@gascon
            test -d /usr/share/locale/oc@gascon/LC_MESSAGES
            # Un logiciel installé ensuite garde sa traduction occitane
            mkdir -p /tmp/essai/DEBIAN /tmp/essai/usr/share/locale/oc/LC_MESSAGES /tmp/essai/usr/share/locale/de/LC_MESSAGES
            printf "Package: essai-langues\nVersion: 1\nArchitecture: all\nMaintainer: Occitux <occitux@example.org>\nDescription: essai\n" > /tmp/essai/DEBIAN/control
            touch /tmp/essai/usr/share/locale/oc/LC_MESSAGES/essai.mo /tmp/essai/usr/share/locale/de/LC_MESSAGES/essai.mo
            dpkg-deb --build /tmp/essai /tmp/essai.deb
            dpkg -i /tmp/essai.deb
            test -e /usr/share/locale/oc/LC_MESSAGES/essai.mo
            test ! -e /usr/share/locale/de/LC_MESSAGES/essai.mo
            grep -q "\"oc, fr-FR, fr, en-US, en\"" /usr/lib/firefox/defaults/pref/occitux.js
            grep -x "locale=fr_FR.UTF-8" /home/jerry/.config/gcompris/gcompris-qt.conf
            grep -x "locale=fr_FR.UTF-8" /etc/skel-jerry/.config/gcompris/gcompris-qt.conf
            grep -x "LANG=oc_FR.UTF-8" /etc/default/locale
            grep -x "LANGUAGE=oc:fr" /etc/default/locale
            locale -a | grep -qi "^oc_FR.utf8$"
            grep -x "XKBVARIANT=\"oci\"" /etc/default/keyboard
            grep -q "noble-security" /etc/apt/apt.conf.d/51occitux-unattended-upgrades
            # Occitux à la place de PrimTux : noms, menu des élèves, écran de connexion
            grep -x "NAME=\"Occitux\"" /usr/lib/os-release
            grep -x "GRUB_TITLE=Occitux" /etc/linuxmint/info
            dpkg-divert --listpackage /usr/share/primtuxmenu/templates/index.html | grep -x occitux
            test -f /usr/share/occitux/originaux/usr/share/primtuxmenu/templates/index.html
            grep -q "Occitux" /usr/share/primtuxmenu/templates/index.html
            grep -q "Quin personatge" /usr/share/primtuxmenu/templates/index.html
            grep -q "Matematicas" /usr/share/primtuxmenu/SQL/INSERT_levels.sql
            sqlite3 /var/lib/primtuxmenu/primtuxmenu.db "select name_level_one from levels" | grep -x Matematicas
            grep -q "Senhal" /usr/share/web-greeter/themes/neon/bundle.js
            sed -i "s/^LANGUE=.*/LANGUE=fr/; s/^CLAVIER=.*/CLAVIER=azerty/" /etc/occitux/occitux.conf
            occitux-config
            grep -x "LANG=fr_FR.UTF-8" /etc/default/locale
            grep -x "XKBVARIANT=\"\"" /etc/default/keyboard
            grep -x "locale=system" /home/jerry/.config/gcompris/gcompris-qt.conf
            test ! -e /usr/lib/firefox/defaults/pref/occitux.js
            sed -i "s/^LANGUE=.*/LANGUE=bearnes/" /etc/occitux/occitux.conf
            occitux-config
            grep -x "LANGUAGE=oc_FR@gascon:oc:fr" /etc/default/locale
            apt-get purge -y -q occitux
            test ! -e /etc/apt/apt.conf.d/51occitux-unattended-upgrades
            test ! -e /usr/share/locale/oc@gascon
            # PrimTux reprend ses fichiers et ses noms
            test -z "$(dpkg-divert --listpackage /usr/share/primtuxmenu/templates/index.html)"
            grep -q "Quel personnage" /usr/share/primtuxmenu/templates/index.html
            grep -x "GRUB_TITLE=PrimTux9" /etc/linuxmint/info
            sqlite3 /var/lib/primtuxmenu/primtuxmenu.db "select name_level_one from levels" | grep -x "Mathématiques"
          '

      - uses: actions/upload-artifact@v7
        with:
          name: occitux-deb
          path: construction/*.deb

      - name: Publier le paquet avec la version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" construction/*.deb \
            --title "Occitux $GITHUB_REF_NAME" \
            --notes "Paquet occitux à installer sur PrimTux 9 : sudo apt install ./occitux_*_all.deb. Les PC Occitux le reçoivent tout seuls par le dépôt apt."

  # Dépôt apt sur GitHub Pages (branche gh-pages) : les PC Occitux reçoivent
  # chaque version publiée comme une mise à jour de sécurité.
  depot:
    needs: paquet
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: occitux-deb
          path: construction

      - name: Dépôt existant (gh-pages)
        run: |
          git fetch origin gh-pages:gh-pages 2>/dev/null && git worktree add depot-pages gh-pages || { mkdir depot-pages; git -C depot-pages init -q -b gh-pages; }

      - name: Clé de signature
        env:
          CLE: ${{ secrets.OCCITUX_CLE_APT }}
        run: |
          sudo apt-get install -y -q apt-utils >/dev/null
          test -n "$CLE" || { echo "secret OCCITUX_CLE_APT manquant" >&2; exit 1; }
          echo "$CLE" | gpg --batch --import

      - name: Construire et signer le dépôt
        run: ./construire/depot-apt.sh depot-pages construction/occitux_*_all.deb

      - name: Publier sur gh-pages
        run: |
          cd depot-pages
          git config user.name "Occitux CI"
          git config user.email "occitux-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Dépôt apt : occitux $GITHUB_REF_NAME" || exit 0
          git push -q "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
