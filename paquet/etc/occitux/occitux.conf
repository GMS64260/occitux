# Réglages d'Occitux.
# Après une modification : sudo occitux-config, puis redémarrer le PC.

# Langue de l'interface :
#   bearnes = béarnais là où Occitux a une traduction, sinon occitan, sinon français
#   oc      = occitan (surtout languedocien), avec repli en français
#   fr      = français
LANGUE=oc

# Disposition du clavier :
#   oci    = AZERTY occitan (lettres accentuées occitanes en accès direct)
#   azerty = AZERTY français habituel
CLAVIER=oci

# Mises à jour de sécurité automatiques (Ubuntu et Linux Mint) : oui ou non
MISES_A_JOUR_AUTO=oui
